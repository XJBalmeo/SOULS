<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULS</title>
    <link rel="icon" type="image/png" href="sprites/logo.png">
    <link rel="stylesheet" href="style.css?v=60">
    <!-- Load Phaser 3 locally so the game works fully offline -->
    <script src="js/phaser.min.js"></script>
</head>
<body>
    <div id="fullscreen-overlay">
        <img src="sprites/pause.png" style="width: 100%; height: 100%; object-fit: contain; pointer-events: none;" alt="Click to play in fullscreen">
    </div>

    <div id="game-container"></div>
    
    <!-- Load Game Scripts. Each page load asks for fresh copies (?v=time):
         simple servers such as "python -m http.server" send no cache rules,
         so the browser could otherwise keep running an old script.
         async = false keeps them running in this order. -->
    <script>
      (function () {
        var v = Date.now();
        ["SaveManager", "Sfx", "HollowArcher", "Starved", "ParryDeath", "Guard", "Spawn",
         "GameScene", "UIScenes", "main"].forEach(function (name) {
          var s = document.createElement("script");
          s.src = "js/" + name + ".js?v=" + v;
          s.async = false;
          document.body.appendChild(s);
        });
      })();
    </script>
</body>
</html>
